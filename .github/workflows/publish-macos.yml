name: Publish QA-approved macOS candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact signed candidate version
        required: true
        type: string
      producer_run:
        description: Source signing workflow run ID
        required: true
        type: string
      archive_attempt:
        description: Archive attempt from the source workflow summary
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the exact manifest that passed QA
        required: true
        type: string
      qa_evidence:
        description: Link to successful qktrx QA evidence for that manifest
        required: true
        type: string
      release_notes:
        description: User-facing release notes
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1440364445' && github.repository_owner_id == '349119698' && github.ref == 'refs/heads/main'
    concurrency:
      group: publish-macos-${{ inputs.version }}
      cancel-in-progress: false
    environment: qktrx-release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: kg-qktrx-dev
          workload_identity_provider: projects/1060876531541/locations/global/workloadIdentityPools/qktrx-release-archive/providers/github
          service_account: qktrx-dev-release-publish-ci@kg-qktrx-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify and publish exact archived files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          ARCHIVE_ATTEMPT: ${{ inputs.archive_attempt }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          QA_EVIDENCE: ${{ inputs.qa_evidence }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: bash scripts/publish-macos.sh
